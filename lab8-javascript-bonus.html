<Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Button</title>
    <style>
        body {
            font-family: helvetica, arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .button {
            font-size: 20px;
            color: white;
            padding: 10px 20px;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #45a049;
        }
        .button:active {
            background-color: #d81616;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Page</h1>
    <button id="nameButton" class="button">Click Me!</button>
    <script>
        document.write("<p>Created by: Michael Jeneviez</p>");
        // Get the button element
        const button = document.getElementById('nameButton');

        // Add a click event listener to the button
        button.addEventListener('click', () => {
            // Prompt the user for their name
            const user = prompt('Please enter your name:');

            // If a name was entered, alert it and put it into a new paragraph
            const greetingId = 'greeting';
            let greeting = document.getElementById(greetingId);

            if (user) {
                alert(`Hello, ${user}!`);

                if (!greeting) {
                    greeting = document.createElement('p');
                    greeting.id = greetingId;
                    button.insertAdjacentElement('afterend', greeting);
                }

                greeting.textContent = `Hello, ${user}!`;
            } else {
                if (greeting) {
                    greeting.remove();
                }
            }
        });
    </script>
    <button id="colorButton" class="button">Change Color</button>
    <script>
        // Get the color change button element
        const colorButton = document.getElementById('colorButton');

        // Add a click event listener to the color change button
        colorButton.addEventListener('click', () => {
            // Change the background color of the first button
            button.style.backgroundColor = 'cyan';
        });
    </script>
</body>
</html>
