<!DOCTYPE html>
<html lang="en">
<head>
       <!--meta information for the page-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Haven</title>
    <style>

        /* ==== RESET & BASE Format ====*/
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Georgia, 'Times New Roman', serif;
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            grid-template-areas: 
                "header"
                "nav"
                "main"
                "footer";
        }

        /* ==== GRID AREAS ====*/
        .header {
            grid-area: header;
            background-color: #3a1a03; /* Dark brown */
            color: #fcf0cc; /* Cream */
            padding: 2rem;
            text-align: center;
        }

        /*Navagation style*/
        .nav {
            grid-area: nav;
            background-color: #d2691e; /* Medium brown */
        }
        .nav ul {
            display: flex;
            justify-content: center;
            gap: 2rem;
            list-style: none;
            padding: 1rem;
        }
        .nav a {
            color: #fcf0cc; /* Cream */
            text-decoration: none;
            font-weight: bold;
        }
        .nav a:hover {
            text-decoration: underline;
        }

        /*Coffee types style*/
        .main-content {
            grid-area: main;
            padding: 2rem;
            background-color: #fafaea; /* Light cream */
        }
        .main-content h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #3a1a03; /* Dark brown */
        }

        /*Footer style*/
        .footer {
            grid-area: footer;
            background-color: #3a1a03; /* Dark brown */
            color: #fcf0cc; /* Cream */
            padding: 1rem;
            text-align: center;
        }

        /* ===== FLEXBOX FOR COFFEE ITEMS ===== */
        .flex-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
        }
        .flex-item {
            background-color: #805130; /* Coffee  brown */
            color: #fcf0cc; /* Cream */
            padding: 2rem 3rem;
            text-align: center;
            border-radius: 10px;
            font: 1.2em bold sans-serif;
            min-width: 150px;
        }
        /* ===== RESPONSIVE: MOBILE ===== */
        @media (max-width: 600px) {
            .nav ul {
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
            }
            .flex-item {
                width: 100%;
            }
        }
    </style>
    </head>
        <body>
            <header class="header">
                <h1>Java Haven</h1>
                <p>Your daily dose of caffeine and comfort.</p>
            </header>

            <!-- Navagation -->
             <nav class="nav">
                <ul>
                    <li><a href="#menu">Menu</a></li>
                    <li><a href="#about">About Us</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
             </nav>

             <!--Coffee types-->
             <main class="main-content">
                <h2>Featured Coffees</h2>
                <div class="flex-container">
                    <div class="flex-item">Espresso</div>
                    <div class="flex-item">Cappuccino</div>
                    <div class="flex-item">Latte</div>
                    <div class="flex-item">Mocha</div>
             </div>
            </main>
            <footer class="footer">
                <p>&copy; 2025 Java Haven. All Rights Reserved.</p>
            </footer>
        </body>
</html>
