<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab 6 – CSS Box Model</title>

  <style>
    /* ===============================
       Part 4: The box‑sizing Experiment
       Follow the steps below exactly.
       =============================== */

    /* --------------------------------
       STEP 1: Comment OUT this block
       to see how widths behave WITHOUT
       border-box (content-box default).
       Then re‑enable it for STEP 4.
       -------------------------------- */
    * {
      box-sizing: border-box;
    }

    /* Base page styles (just for readability) */
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height: 1.4;
      margin: 24px;
      color: #1a1a1a;
      background: #f7f7f7;
    }

    h1 {
      margin-bottom: 16px;
    }

    /* --------------------------------
       STEP 2: Add explicit width to .box
       (Already done here per instructions)
       -------------------------------- */
    .box {
      /* IMPORTANT for the experiment:
         Keep width at 300px and observe the
         computed/actual width in DevTools. */
      width: 300px;

      /* Box model props */
      padding: 20px;                /* total padding = 40px */
      border: 5px solid #0672ff;    /* total border = 10px */
      margin: 20px;

      /* A little styling for visibility */
      background-color: #cdd4d6;
      color: #222;
      box-shadow: 0 0 0 0 rgba(0,0,0,0); /* neutral */
    }

    /* Third box: same layout, different border color
       (no width override here—so it participates in the experiment too) */
    .box.experiment {
      border-color: #e6cc76;
      background-color: #dcdfe2; /* optional subtle difference */
    }
  </style>
</head>
<body>

  <h1>CSS Box Model Lab</h1>

  <div class="box">
    <p>This is Box 1. It demonstrates the CSS Box Model.</p>
  </div>

  <div class="box">
    <p>This is Box 2. Notice the margin between boxes.</p>
  </div>

  <div class="box experiment">
    <p>This is Box 3. It has additional experimental styles.</p>
  </div>

  <!--
    ===============================
    HOW TO DO THE EXPERIMENT
    ===============================

    STEP 1: Comment OUT the universal rule:
        * { box-sizing: border-box; }
      (Put /* ... */ around it.)

    STEP 2: Ensure .box has width: 300px; (it does).

    STEP 3: Open DevTools
      - Right-click a box → Inspect
      - Go to the "Computed" tab or the Box Model diagram
      - WITHOUT border-box, the ACTUAL total width should be:
          300 (content) + 40 padding (20×2) + 10 border (5×2) = 350px total

    STEP 4: Re‑enable (uncomment) the universal rule:
        * { box-sizing: border-box; }

      - Inspect again. WITH border-box, the declared width (300px)
        now INCLUDES padding and border, so the total width is 300px.
        (Content width becomes 300 − 40 − 10 = 250px.)

    TIP: To verify, look at the Box Model diagram in DevTools:
         - With border-box ON → outer width is 300
         - With border-box OFF → outer width is 350

    NOTE: The third box (.box.experiment) uses the same width and padding,
          only its border color differs. It should show the same measurements.
  -->

</body>
</html>
